[project]
name = "crypto-backtesting-engine"
version = "0.1.0"
description = "Production-grade event-driven crypto backtesting engine"
authors = [
    { name = "eugeneleejunping", email = "eugeneleejunping@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crypto-indicators",
    "pydantic>=2.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "setuptools==82.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtester"]

[tool.uv.sources]
crypto-indicators = { path = "../crypto_indicators" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# Discover tests only in the tests/ directory.
testpaths = ["tests"]
# Verbose output by default — shows each test name and pass/fail.
addopts = "-v"
